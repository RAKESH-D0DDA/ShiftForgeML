name: Contract tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute contract tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit -v
